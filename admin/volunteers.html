<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>স্বেচ্ছাসেবক - অ্যাডমিন</title>
<link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;500;600;700&family=Noto+Serif+Bengali:wght@700;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../css/style.css"><link rel="stylesheet" href="admin.css">
</head>
<body class="admin-body">
<aside class="sidebar" id="sidebar">
  <div class="sidebar-logo"><div style="background:linear-gradient(135deg,var(--green-light),var(--green-bright));border-radius:10px;display:flex;align-items:center;justify-content:center;font-family:'Noto Serif Bengali',serif;font-size:20px;font-weight:900;color:white;width:38px;height:38px;flex-shrink:0;">ক</div><div><div style="font-weight:700;font-size:14px;color:white">কায়রা ফাউন্ডেশন</div><div style="font-size:11px;opacity:0.6;color:white">অ্যাডমিন প্যানেল</div></div></div>
  <nav class="sidebar-nav">
    <a href="dashboard.html" class="sidebar-link">🏠 ড্যাশবোর্ড</a>
    <a href="projects.html" class="sidebar-link">📋 প্রকল্পসমূহ</a>
    <a href="events.html" class="sidebar-link">📅 ইভেন্ট</a>
    <a href="team.html" class="sidebar-link">👥 টিম মেম্বার</a>
    <a href="gallery.html" class="sidebar-link">🖼️ গ্যালারি</a>
    <a href="partners.html" class="sidebar-link">🤝 অংশীদার</a>
    <a href="volunteers.html" class="sidebar-link active">🙋 স্বেচ্ছাসেবক</a>
    <a href="messages.html" class="sidebar-link">✉️ বার্তা</a>
    <a href="donations.html" class="sidebar-link">💚 ডোনেশন</a>
    <a href="settings.html" class="sidebar-link">⚙️ সেটিংস</a>
  </nav>
  <div class="sidebar-footer"><div class="admin-info"><div class="admin-avatar">A</div><div><div id="adminName" style="font-size:14px;font-weight:600;color:white"></div></div></div><button onclick="logout()" class="logout-btn">লগআউট</button></div>
</aside>

<main class="admin-main">
  <div class="admin-header">
    <div><h1 class="admin-title">স্বেচ্ছাসেবক আবেদন</h1><p class="admin-subtitle">সকল আবেদন পর্যালোচনা ও অনুমোদন করুন</p></div>
    <div style="display:flex;gap:10px">
      <button class="sidebar-toggle" id="sidebarToggle">☰</button>
      <select id="statusFilter" onchange="loadVolunteers(this.value)" style="padding:8px 14px;border:1.5px solid #e0ece3;border-radius:var(--radius-sm);font-family:'Hind Siliguri',sans-serif;font-size:14px;outline:none;">
        <option value="">সব আবেদন</option>
        <option value="pending">পেন্ডিং</option>
        <option value="approved">অনুমোদিত</option>
        <option value="rejected">প্রত্যাখ্যাত</option>
      </select>
    </div>
  </div>

  <div class="admin-card">
    <div class="table-wrapper">
      <table class="admin-table">
        <thead><tr><th>নাম</th><th>ফোন</th><th>ইমেইল</th><th>জেলা</th><th>দক্ষতা</th><th>অবস্থা</th><th>কর্ম</th></tr></thead>
        <tbody id="volunteersTable"><tr><td colspan="7" class="loading-placeholder">লোড হচ্ছে...</td></tr></tbody>
      </table>
    </div>
  </div>
</main>

<div class="toast"></div>
<script src="../js/config.js"></script><script src="admin.js"></script>
<script>
document.addEventListener('DOMContentLoaded', () => { requireAdminAuth(); loadAdminUser(); loadVolunteers(); });

async function loadVolunteers(status = '') {
  const tbody = document.getElementById('volunteersTable');
  tbody.innerHTML = '<tr><td colspan="7" class="loading-placeholder">লোড হচ্ছে...</td></tr>';
  try {
    const url = status ? `/admin/volunteers?status=${status}` : '/admin/volunteers';
    const data = await adminFetch(url);
    if (!data.success) throw new Error();
    tbody.innerHTML = data.data.map(v => `
      <tr>
        <td><strong>${v.name}</strong></td>
        <td>${v.phone}</td>
        <td>${v.email || '-'}</td>
        <td>${v.district || '-'}</td>
        <td style="max-width:150px;font-size:12px">${v.skills || '-'}</td>
        <td><span class="badge ${v.status}">${v.status === 'pending' ? 'পেন্ডিং' : v.status === 'approved' ? 'অনুমোদিত' : 'প্রত্যাখ্যাত'}</span></td>
        <td>
          ${v.status !== 'approved' ? `<button class="admin-btn" style="padding:5px 12px;font-size:12px" onclick="updateVolunteer(${v.id},'approved')">✓ অনুমোদন</button>` : ''}
          ${v.status !== 'rejected' ? `<button class="admin-btn danger" style="padding:5px 12px;font-size:12px;margin-left:4px" onclick="updateVolunteer(${v.id},'rejected')">✗ প্রত্যাখ্যান</button>` : ''}
        </td>
      </tr>`).join('') || '<tr><td colspan="7" class="loading-placeholder">কোনো আবেদন নেই</td></tr>';
  } catch(e) { tbody.innerHTML = '<tr><td colspan="7" class="loading-placeholder">লোড করা যায়নি</td></tr>'; }
}

async function updateVolunteer(id, status) {
  const res = await adminFetch('/admin/volunteers', { method: 'PUT', body: JSON.stringify({ id, status }) });
  if (res.success) { showToast('অবস্থা আপডেট হয়েছে'); loadVolunteers(document.getElementById('statusFilter').value); }
  else showToast('আপডেট ব্যর্থ', 'error');
}
</script>
</body></html>
