<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>প্রকল্পসমূহ - অ্যাডমিন</title>
<link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;500;600;700&family=Noto+Serif+Bengali:wght@700;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../css/style.css">
<link rel="stylesheet" href="admin.css">
</head>
<body class="admin-body">

<aside class="sidebar" id="sidebar">
  <div class="sidebar-logo">
    <div style="background:linear-gradient(135deg,var(--green-light),var(--green-bright));border-radius:10px;display:flex;align-items:center;justify-content:center;font-family:'Noto Serif Bengali',serif;font-size:20px;font-weight:900;color:white;width:38px;height:38px;flex-shrink:0;">ক</div>
    <div><div style="font-weight:700;font-size:14px;color:white">কায়রা ফাউন্ডেশন</div><div style="font-size:11px;opacity:0.6;color:white">অ্যাডমিন প্যানেল</div></div>
  </div>
  <nav class="sidebar-nav">
    <a href="dashboard.html" class="sidebar-link">🏠 ড্যাশবোর্ড</a>
    <a href="projects.html" class="sidebar-link active">📋 প্রকল্পসমূহ</a>
    <a href="events.html" class="sidebar-link">📅 ইভেন্ট</a>
    <a href="team.html" class="sidebar-link">👥 টিম মেম্বার</a>
    <a href="gallery.html" class="sidebar-link">🖼️ গ্যালারি</a>
    <a href="partners.html" class="sidebar-link">🤝 অংশীদার</a>
    <a href="volunteers.html" class="sidebar-link">🙋 স্বেচ্ছাসেবক</a>
    <a href="messages.html" class="sidebar-link">✉️ বার্তা</a>
    <a href="donations.html" class="sidebar-link">💚 ডোনেশন</a>
    <a href="settings.html" class="sidebar-link">⚙️ সেটিংস</a>
  </nav>
  <div class="sidebar-footer">
    <div class="admin-info"><div class="admin-avatar">A</div><div><div id="adminName" style="font-size:14px;font-weight:600;color:white"></div></div></div>
    <button onclick="logout()" class="logout-btn">লগআউট</button>
  </div>
</aside>

<main class="admin-main">
  <div class="admin-header">
    <div><h1 class="admin-title">প্রকল্পসমূহ</h1><p class="admin-subtitle">প্রকল্প যোগ, সম্পাদনা ও মুছুন</p></div>
    <div style="display:flex;gap:10px">
      <button class="sidebar-toggle" id="sidebarToggle">☰</button>
      <button class="admin-btn" onclick="openModal('projectModal')">+ নতুন প্রকল্প</button>
    </div>
  </div>

  <div class="admin-card">
    <div class="table-wrapper">
      <table class="admin-table">
        <thead>
          <tr><th>শিরোনাম</th><th>ক্যাটাগরি</th><th>অবস্থা</th><th>উপকারভোগী</th><th>কর্ম</th></tr>
        </thead>
        <tbody id="projectsTable"><tr><td colspan="5" class="loading-placeholder">লোড হচ্ছে...</td></tr></tbody>
      </table>
    </div>
  </div>
</main>

<!-- Project Modal -->
<div class="modal-overlay" id="projectModal">
  <div class="modal-box">
    <div class="modal-header">
      <h3 id="modalTitle">নতুন প্রকল্প যোগ করুন</h3>
      <button class="modal-close" onclick="closeModal('projectModal')">✕</button>
    </div>
    <form id="projectForm">
      <input type="hidden" id="editProjectId">
      <div class="admin-form-group"><label>শিরোনাম *</label><input type="text" id="pTitle" required></div>
      <div class="form-row">
        <div class="admin-form-group"><label>ক্যাটাগরি</label>
          <select id="pCategory">
            <option value="education">📚 শিক্ষা</option>
            <option value="health">🏥 স্বাস্থ্য</option>
            <option value="poverty">🌾 দারিদ্র্য বিমোচন</option>
            <option value="environment">🌿 পরিবেশ</option>
            <option value="other">📌 অন্যান্য</option>
          </select>
        </div>
        <div class="admin-form-group"><label>অবস্থা</label>
          <select id="pStatus">
            <option value="ongoing">চলমান</option>
            <option value="completed">সম্পন্ন</option>
            <option value="upcoming">আসন্ন</option>
          </select>
        </div>
      </div>
      <div class="admin-form-group"><label>সংক্ষিপ্ত বিবরণ</label><input type="text" id="pShortDesc" placeholder="সংক্ষিপ্তে প্রকল্পটি বর্ণনা করুন"></div>
      <div class="admin-form-group"><label>বিস্তারিত বিবরণ</label><textarea id="pDesc"></textarea></div>
      <div class="form-row">
        <div class="admin-form-group"><label>অবস্থান</label><input type="text" id="pLocation" placeholder="যেমন: রংপুর"></div>
        <div class="admin-form-group"><label>উপকারভোগী সংখ্যা</label><input type="number" id="pBeneficiaries" min="0"></div>
      </div>
      <div class="form-row">
        <div class="admin-form-group"><label>শুরুর তারিখ</label><input type="date" id="pStartDate"></div>
        <div class="admin-form-group"><label>শেষ তারিখ</label><input type="date" id="pEndDate"></div>
      </div>
      <div class="admin-form-group"><label>কভার ছবি</label><input type="file" id="pCoverImage" accept="image/*"></div>
      <div style="display:flex;gap:10px;justify-content:flex-end;margin-top:8px">
        <button type="button" class="admin-btn secondary" onclick="closeModal('projectModal')">বাতিল</button>
        <button type="submit" class="admin-btn" id="projectSubmitBtn">সংরক্ষণ করুন</button>
      </div>
    </form>
  </div>
</div>

<div class="toast" id="toast"></div>
<script src="../js/config.js"></script>
<script src="admin.js"></script>
<script>
document.addEventListener('DOMContentLoaded', () => { requireAdminAuth(); loadAdminUser(); loadProjects(); });

async function loadProjects() {
  const tbody = document.getElementById('projectsTable');
  try {
    const data = await adminFetch('/admin/projects');
    if (!data.success) throw new Error();
    tbody.innerHTML = data.data.map(p => `
      <tr>
        <td><strong>${p.title}</strong></td>
        <td>${CATEGORIES[p.category] || p.category}</td>
        <td><span class="badge ${p.status}">${STATUS_LABELS[p.status]?.label || p.status}</span></td>
        <td>${Number(p.beneficiaries).toLocaleString('bn-BD')}</td>
        <td>
          <button class="admin-btn" style="padding:6px 14px;font-size:12px" onclick="editProject(${JSON.stringify(p).replace(/"/g,'&quot;')})">সম্পাদনা</button>
          <button class="admin-btn danger" style="padding:6px 14px;font-size:12px;margin-left:6px" onclick="deleteProject(${p.id})">মুছুন</button>
        </td>
      </tr>`).join('') || '<tr><td colspan="5" class="loading-placeholder">কোনো প্রকল্প নেই</td></tr>';
  } catch(e) { tbody.innerHTML = '<tr><td colspan="5" class="loading-placeholder">লোড করা যায়নি</td></tr>'; }
}

function editProject(p) {
  document.getElementById('modalTitle').textContent = 'প্রকল্প সম্পাদনা করুন';
  document.getElementById('editProjectId').value = p.id;
  document.getElementById('pTitle').value = p.title;
  document.getElementById('pCategory').value = p.category;
  document.getElementById('pStatus').value = p.status;
  document.getElementById('pShortDesc').value = p.short_desc || '';
  document.getElementById('pDesc').value = p.description || '';
  document.getElementById('pLocation').value = p.location || '';
  document.getElementById('pBeneficiaries').value = p.beneficiaries || 0;
  document.getElementById('pStartDate').value = p.start_date || '';
  document.getElementById('pEndDate').value = p.end_date || '';
  openModal('projectModal');
}

async function deleteProject(id) {
  confirmDelete('এই প্রকল্পটি মুছে ফেলতে চান?', async () => {
    const res = await adminFetch(`/admin/projects?id=${id}`, { method: 'DELETE' });
    if (res.success) { showToast('প্রকল্প মুছে ফেলা হয়েছে'); loadProjects(); }
    else showToast('মুছতে ব্যর্থ', 'error');
  });
}

document.getElementById('projectForm').addEventListener('submit', async (e) => {
  e.preventDefault();
  const id = document.getElementById('editProjectId').value;
  const data = {
    id, title: document.getElementById('pTitle').value,
    category: document.getElementById('pCategory').value,
    status: document.getElementById('pStatus').value,
    short_desc: document.getElementById('pShortDesc').value,
    description: document.getElementById('pDesc').value,
    location: document.getElementById('pLocation').value,
    beneficiaries: document.getElementById('pBeneficiaries').value,
    start_date: document.getElementById('pStartDate').value,
    end_date: document.getElementById('pEndDate').value,
  };
  const method = id ? 'PUT' : 'POST';
  const res = await adminFetch('/admin/projects', { method, body: JSON.stringify(data) });
  if (res.success) { showToast(id ? 'প্রকল্প আপডেট হয়েছে' : 'প্রকল্প যোগ হয়েছে'); closeModal('projectModal'); loadProjects(); document.getElementById('editProjectId').value = ''; document.getElementById('modalTitle').textContent = 'নতুন প্রকল্প যোগ করুন'; }
  else showToast('সংরক্ষণ ব্যর্থ', 'error');
});
</script>
</body>
</html>
